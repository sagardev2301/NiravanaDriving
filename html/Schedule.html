<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen relative pb-[180px]">
<!-- TopAppBar from JSON -->
<header class="bg-surface dark:bg-surface-dim shadow-sm flex justify-between items-center px-margin-mobile h-16 w-full z-50 fixed top-0">
    <div class="h-8 w-8 rounded-full overflow-hidden bg-surface-variant flex-shrink-0">

</header>

    <!-- Header -->

            <h2 class="font-title-lg text-title-lg text-on-surface font-semibold">Tomorrow, Oct 26</h2>
        </div>
    </section>
    <!-- Auto-Fill Action -->
    <div class="px-margin-mobile py-4 bg-background">
        <button class="w-full bg-primary-container text-on-primary-container rounded-xl p-4 flex items-center justify-center gap-2 shadow-sm border border-primary/20 hover:bg-primary-container/90 transition-colors focus:ring-2 focus:ring-primary focus:outline-none">
            <span class="text-[20px]">⚡</span>
            <span class="font-label-lg text-label-lg font-bold">Auto-Fill from Today's Schedule</span>
        </button>
    </div>
    <!-- Schedule List -->
    <section class="px-margin-mobile pb-4 flex flex-col gap-3">
        <!-- Learner Card 1 -->
        <div class="bg-surface border border-outline-variant rounded-xl p-3 flex items-center gap-3 shadow-sm relative group hover:bg-surface-container-lowest transition-colors">

            <div class="flex-1 flex flex-col gap-2 min-w-0">

                        08:00 - 09:00 AM

                    <div class="w-10 h-10 rounded-full overflow-hidden bg-tertiary-container flex-shrink-0">

                        <span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 truncate">
<span class="material-symbols-outlined text-[14px] flex-shrink-0">location_on</span> City Dr, North
</span>
                    </div>
                </div>
            </div>
            <button class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:bg-error-container hover:text-on-error-container transition-colors flex-shrink-0">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div><div class="flex items-center justify-center py-1">
        <div class="flex items-center gap-3 w-full px-8">
            <div class="h-[1px] flex-1 bg-outline-variant opacity-30"></div>
            <span class="text-on-surface-variant font-label-md text-label-md italic opacity-60">— 30 min buffer —</span>
            <div class="h-[1px] flex-1 bg-outline-variant opacity-30"></div>
        </div>
    </div>
        <!-- Learner Card 2 -->
        <div class="bg-surface border border-outline-variant rounded-xl p-3 flex items-center gap-3 shadow-sm relative group hover:bg-surface-container-lowest transition-colors">
            <div class="text-outline cursor-grab active:cursor-grabbing hover:text-on-surface transition-colors flex-shrink-0">
                <span class="material-symbols-outlined">drag_indicator</span>
            </div>
            <div class="flex-1 flex flex-col gap-2 min-w-0">
                <div class="flex items-center gap-2">

                    </div>
                    <div class="flex flex-col min-w-0">
                        <span class="font-label-lg text-label-lg text-on-surface font-bold truncate">Vikram J.</span>
                        <span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 truncate">
<span class="material-symbols-outlined text-[14px] flex-shrink-0">location_on</span> Hwy Pr, Downtown
</span>
                    </div>
                </div>
            </div>
            <button class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:bg-error-container hover:text-on-error-container transition-colors flex-shrink-0">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div><div class="flex items-center justify-center py-1">
        <div class="flex items-center gap-3 w-full px-8">
            <div class="h-[1px] flex-1 bg-outline-variant opacity-30"></div>
            <span class="text-on-surface-variant font-label-md text-label-md italic opacity-60">— 30 min buffer —</span>
            <div class="h-[1px] flex-1 bg-outline-variant opacity-30"></div>
        </div>
    </div>
        <!-- Learner Card 3 -->
        <div class="bg-surface border border-outline-variant rounded-xl p-3 flex items-center gap-3 shadow-sm relative group hover:bg-surface-container-lowest transition-colors">
            <div class="text-outline cursor-grab active:cursor-grabbing hover:text-on-surface transition-colors flex-shrink-0">
                <span class="material-symbols-outlined">drag_indicator</span>
            </div>
            <div class="flex-1 flex flex-col gap-2 min-w-0">
                <div class="flex items-center gap-2">
                    <button class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-outline-variant bg-surface hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md">

                    </div>
                    <div class="flex flex-col min-w-0">
                        <span class="font-label-lg text-label-lg text-on-surface font-bold truncate">Neha P.</span>
                        <span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 truncate">
<span class="material-symbols-outlined text-[14px] flex-shrink-0">location_on</span> Parallel P, Westside
</span>

                </div>
            </div>
            <button class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:bg-error-container hover:text-on-error-container transition-colors flex-shrink-0">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>
    </section>
    <!-- Quick Add -->
    <div class="px-margin-mobile pb-6">
        <button class="w-full py-3 rounded-xl border-2 border-dashed border-outline-variant text-primary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary/5 transition-colors">
            <span class="material-symbols-outlined text-[20px]">add</span>
            + Add Extra Learner / Slot
        </button>
    </div>
</main>
<!-- Sticky Action Area -->
<div class="fixed bottom-20 left-0 right-0 bg-surface/95 backdrop-blur-md px-margin-mobile py-4 flex flex-col gap-3 z-40 border-t border-surface-variant shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
    <button class="w-full py-3 px-4 rounded-full border border-primary text-primary font-label-lg text-label-lg hover:bg-primary/5 transition-colors text-center focus:ring-2 focus:ring-primary focus:outline-none">
        Save Draft
    </button>
    <button class="w-full py-3 px-4 rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary/90 transition-colors text-center flex items-center justify-center gap-2 focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:outline-none">
        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">publish</span>
        Publish &amp; Send Notifications (5 Classes)
    </button>
</div>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface-container dark:bg-surface-container-low shadow-[0_-1px_3px_0_rgba(0,0,0,0.1)] rounded-t-none">
    <!-- Home -->
    <button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-lg">

        <span class="font-label-md text-label-md">Home</span>
    </button>
    <!-- Schedule (Active) -->
    <button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-5 py-1 scale-90 transition-all duration-200">

        <span class="font-label-md text-label-md">Schedule</span>
    </button>
    <!-- Learners -->

        <span class="material-symbols-outlined mb-1">school</span>
        <span class="font-label-md text-label-md">Learners</span>
    </button>
    <!-- Profile -->
    <button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-lg">
        <span class="material-symbols-outlined mb-1">person</span>
        <span class="font-label-md text-label-md">Profile</span>
    </button>
</nav>
