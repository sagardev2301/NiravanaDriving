        /* Custom Checkbox Styles */
        .learner-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid theme('colors.outline');
            border-radius: 4px;
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease-in-out;

        .learner-checkbox:checked {

            border-color: theme('colors.primary');
        }

        .learner-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;

        </div>
        <button class="w-full h-12 bg-primary text-on-primary rounded-button font-label-lg text-label-lg font-semibold flex items-center justify-center shadow-sm hover:bg-primary/90 transition-all active:scale-[0.98]">

<script>
    // Simple vanilla JS to handle row styling based on checkbox state
    document.addEventListener('DOMContentLoaded', () => {
        const labels = document.querySelectorAll('#learner-list label');
        const countDisplay = document.getElementById('selection-count');
        let selectedCount = document.querySelectorAll('.learner-checkbox:checked').length;

        function updateCount() {
            countDisplay.textContent = `${selectedCount} learner${selectedCount !== 1 ? 's' : ''} selected`;
        }

        labels.forEach(label => {
            const checkbox = label.querySelector('.learner-checkbox');

            // Set initial state styling
            if (checkbox.checked) {
                label.classList.remove('bg-surface', 'hover:bg-surface-variant', 'border-transparent');
                label.classList.add('bg-primary-container', 'text-on-primary-container');

                // Update text colors for selected state
                const texts = label.querySelectorAll('.text-on-surface, .text-on-surface-variant');
                texts.forEach(t => {
                    if (t.classList.contains('text-on-surface')) {
                        t.classList.remove('text-on-surface');
                        t.classList.add('text-on-primary-container');
                        t.dataset.originalColor = 'text-on-surface';
                    } else if (t.classList.contains('text-on-surface-variant')) {
                        t.classList.remove('text-on-surface-variant');
                        t.classList.add('text-on-primary-container/80');
                        t.dataset.originalColor = 'text-on-surface-variant';
                    }
                });
            }

            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    selectedCount++;
                    label.classList.remove('bg-surface', 'hover:bg-surface-variant', 'border-transparent');
                    label.classList.add('bg-primary-container', 'text-on-primary-container');

                    const texts = label.querySelectorAll('[data-original-color]');
                    texts.forEach(t => {
                         if (t.dataset.originalColor === 'text-on-surface') {
                             t.classList.remove('text-on-surface');
                             t.classList.add('text-on-primary-container');
                         } else {
                             t.classList.remove('text-on-surface-variant');
                             t.classList.add('text-on-primary-container/80');
                         }
                    });

                } else {
                    selectedCount--;
                    label.classList.remove('bg-primary-container', 'text-on-primary-container');
                    label.classList.add('bg-surface', 'hover:bg-surface-variant', 'border-transparent');

                    const texts = label.querySelectorAll('.text-on-primary-container, .text-on-primary-container\\/80');
                    texts.forEach(t => {
                        if (t.classList.contains('text-on-primary-container')) {
                            t.classList.remove('text-on-primary-container');
                            t.classList.add('text-on-surface');
                        } else {
                            t.classList.remove('text-on-primary-container/80');
                            t.classList.add('text-on-surface-variant');
                        }
                    });
                }
                updateCount();
            });
        });
    });
</script>
